[project]
name = "invoice-extractor"
version = "0.3.0"
description = "Extract structured data from PDF invoices with an LLM, validate the numbers, export to Excel."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sohrab Rashidi" }]
dependencies = [
    "pdfplumber>=0.11",
    "pydantic>=2.7",
    "httpx>=0.27",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "reportlab>=4"]

[project.scripts]
invoice-extract = "invoice_extractor.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["invoice_extractor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
